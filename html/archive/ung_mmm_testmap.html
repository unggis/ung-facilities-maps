<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNG Campus Monuments Markers and Memorials Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --navy:   #003366;
  --navy-dk:#001e40;
  --gold:   #C9A84C;
  --gold-lt:#e8d49a;
  --parch:  #faf7f2;
  --sand:   #c9b99a;
  --stone:  #8a7a6a;

  /* Category palette — keyed to the finalized MMM_Category coded-value domain */
  --cat-MON:    #C9A84C; /* Monument */
  --cat-MRK:    #A08558; /* Marker */
  --cat-MEM:    #8B3A3A; /* Memorial */
  --cat-MIL_EQ: #5B6770; /* Military Equipment */
  --cat-NM_BLDG:#3D5A80; /* Named Building/Space */
  --cat-OTH:    #6b6156; /* Other */
}
html, body { height:100%; overflow:hidden; }
body { font-family:'Lato', sans-serif; font-weight:300; background:var(--navy); }
#map { width:100%; height:100vh; background:#e8e0d0; }
.osm-tiles { filter: sepia(0.3) brightness(0.97) contrast(0.92); }

/* ── Accessibility: visible keyboard focus on every interactive control ── */
.campus-btn:focus-visible,
.back-btn:focus-visible,
.popup-btn:focus-visible,
.mmm-lightbox-close:focus-visible,
.mmm-lightbox-nav:focus-visible,
.poi-popup-toggle:focus-visible,
.poi-popup-link:focus-visible,
.legend-row.filterable:focus-visible {
  outline: 2px solid var(--gold-lt);
  outline-offset: 2px;
}

/* ── Accessibility: respect reduced-motion preference ── */
@media (prefers-reduced-motion: reduce) {
  .marker-pulse { animation: none !important; }
}

/* ── Campus panel ── */
.campus-panel {
  position:absolute; top:12px; left:12px; z-index:1000;
  background:rgba(0,30,70,0.94);
  border:1px solid rgba(201,168,76,0.4);
  border-radius:3px; padding:10px 10px 8px; min-width:150px;
  box-shadow:0 2px 12px rgba(0,0,0,0.4);
}
.campus-panel-title {
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--sand); margin-bottom:8px; padding-bottom:6px;
  border-bottom:0.5px solid rgba(201,168,76,0.25);
}
.zoom-level { color:var(--gold); font-weight:700; letter-spacing:0.02em; }
.campus-btn {
  display:flex; justify-content:space-between; align-items:center;
  width:100%; background:var(--navy);
  border:1px solid rgba(201,168,76,0.3); border-radius:2px;
  color:var(--parch); padding:6px 12px; font-size:0.78rem;
  font-family:'Lato', sans-serif; cursor:pointer; margin-bottom:5px;
  text-align:left; letter-spacing:0.02em;
  transition:background 0.15s, border-color 0.15s;
}
.campus-btn:last-child { margin-bottom:0; }
.campus-btn:hover { background:rgba(201,168,76,0.15); border-color:var(--gold); color:var(--gold-lt); }
.campus-btn.active { background:var(--gold); border-color:var(--gold); color:var(--navy); font-weight:700; }
.campus-count { font-size:0.68rem; color:var(--sand); font-weight:400; margin-left:8px; }
.campus-btn.active .campus-count { color:var(--navy-dk); }

.back-btn {
  display:none; align-items:center; gap:6px;
  background:var(--navy); border:1px solid rgba(201,168,76,0.5);
  border-radius:2px; color:var(--gold-lt); padding:6px 12px;
  font-size:0.72rem; font-family:'Lato',sans-serif; letter-spacing:0.05em;
  text-transform:uppercase; cursor:pointer; margin-top:8px; width:100%;
}
.back-btn:hover { background:rgba(201,168,76,0.15); }
.back-btn.show { display:flex; }

/* ── Legend / filter panel (shown only in campus-detail view) ── */
.legend {
  position:absolute; bottom:20px; right:12px; z-index:1000;
  background:rgba(0,30,70,0.92);
  border:1px solid rgba(201,168,76,0.3); border-radius:3px;
  padding:10px 14px; font-size:0.72rem; color:var(--sand);
  max-width:230px;
}
.legend:empty { display:none; }
.legend-title {
  font-family:'Cormorant Garamond', serif; color:var(--gold);
  font-size:0.88rem; margin-bottom:8px; font-weight:600;
}
.legend-sub { font-size:0.62rem; color:var(--stone); margin:-4px 0 8px; letter-spacing:0.03em; }
.legend-row {
  display:flex; align-items:center; gap:8px; margin-bottom:5px;
  cursor:default; user-select:none;
}
.legend-row:last-child { margin-bottom:0; }
/* .legend-row.filterable is now a real <button> — reset native button chrome
   so it still looks like the plain row it always did, but is keyboard-operable */
.legend-row.filterable {
  cursor:pointer; padding:2px 4px; margin:0 -4px 3px; border-radius:2px;
  border:none; background:none; font:inherit; color:inherit;
  width:calc(100% + 8px); text-align:left;
}
.legend-row.filterable:hover { background:rgba(201,168,76,0.08); }
.legend-row.off { opacity:0.35; }
.legend-count { margin-left:auto; font-size:0.64rem; color:var(--stone); }
.legend-badge {
  width:18px; height:18px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:7px; font-weight:700; letter-spacing:0.01em;
  border:1.5px solid rgba(255,255,255,0.35); color:var(--navy-dk);
  font-family:'Lato',sans-serif;
}

/* ── Top-level campus markers ── */
.campus-marker { display:flex; flex-direction:column; align-items:center; }
.marker-dot { width:20px; height:20px; border-radius:50%; position:relative; z-index:2; box-shadow:0 3px 12px rgba(0,0,0,0.6); }
.marker-dot.active  { background:radial-gradient(circle at 35% 35%,#fff8dc,#C9A84C 60%,#a07830); border:2px solid #fff8dc; }
.marker-dot.inactive{ background:radial-gradient(circle at 35% 35%,#9a8a6a,#5a4a30); border:1.5px solid #a09070; }
.marker-pulse { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:20px; height:20px; border-radius:50%; z-index:1; }
.marker-pulse.active   { animation:pulseGold   1.8s ease-out infinite; }
.marker-pulse.inactive { animation:pulseBronze 2.8s ease-out infinite; }
.marker-label { margin-top:4px; font-family:'Lato',sans-serif; font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap; padding:2px 6px; border-radius:2px; }
.marker-label.active   { color:#fff8dc; background:rgba(0,20,60,0.92); border:1px solid rgba(201,168,76,0.8); text-shadow:0 1px 4px rgba(0,0,0,0.9); box-shadow:0 2px 8px rgba(0,0,0,0.5),0 0 12px rgba(201,168,76,0.2); }
.marker-label.inactive { color:#c9b99a; background:rgba(0,15,40,0.88); border:1px solid rgba(120,100,70,0.5); text-shadow:0 1px 3px rgba(0,0,0,0.8); }

@keyframes pulseGold {
  0%   { box-shadow:0 0 0 0 rgba(201,168,76,0.9); opacity:1; }
  50%  { box-shadow:0 0 0 18px rgba(201,168,76,0.15); opacity:0.6; }
  100% { box-shadow:0 0 0 28px rgba(201,168,76,0); opacity:0; }
}
@keyframes pulseBronze {
  0%   { box-shadow:0 0 0 0 rgba(160,140,100,0.7); opacity:1; }
  50%  { box-shadow:0 0 0 14px rgba(160,140,100,0.1); opacity:0.5; }
  100% { box-shadow:0 0 0 20px rgba(160,140,100,0); opacity:0; }
}

/* ── PoI badges (MMM points) ── */
.poi-badge {
  width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Lato',sans-serif; font-size:7.5px; font-weight:700;
  color:var(--navy-dk); border:2px solid rgba(255,255,255,0.55);
  box-shadow:0 2px 8px rgba(0,0,0,0.55);
  letter-spacing:0.01em;
}

/* Cluster styling to match theme */
.mmm-cluster {
  background:radial-gradient(circle at 35% 35%, #fff8dc, var(--gold) 65%, #a07830);
  border:2px solid #fff8dc;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--navy-dk); font-weight:700; font-family:'Lato',sans-serif;
  box-shadow:0 3px 10px rgba(0,0,0,0.55);
}

/* ── Popup (campus-level) ── */
.leaflet-popup-content-wrapper { background:var(--navy); border:1.5px solid var(--gold); border-radius:3px; padding:0; box-shadow:0 4px 20px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.15); min-width:220px; }
.leaflet-popup-content { margin:0; }
.leaflet-popup-tip { background:var(--gold); }
.leaflet-popup-close-button { color:var(--gold) !important; top:6px !important; right:8px !important; }
.popup-inner { padding:14px 16px 12px; }
.popup-campus { font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--sand); margin-bottom:4px; }
.popup-title  { font-family:'Cormorant Garamond',serif; font-size:1.15rem; font-weight:600; color:var(--gold); margin-bottom:6px; }
.popup-desc   { font-size:0.78rem; color:var(--sand); line-height:1.5; margin-bottom:12px; }
.popup-btn { display:inline-block; background:var(--gold); color:var(--navy); padding:6px 14px; border:none; border-radius:2px; font-size:0.72rem; font-weight:700; font-family:'Lato',sans-serif; letter-spacing:0.05em; text-decoration:none; text-transform:uppercase; cursor:pointer; }
.popup-btn:hover { background:var(--gold-lt); }
.popup-btn-disabled { display:inline-block; color:var(--stone); padding:6px 14px; border:0.5px solid rgba(138,122,106,0.3); border-radius:2px; font-size:0.72rem; font-family:'Lato',sans-serif; letter-spacing:0.05em; text-transform:uppercase; cursor:not-allowed; }
.popup-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
.popup-tag  { font-size:0.62rem; padding:2px 7px; border-radius:20px; background:rgba(201,168,76,0.1); color:var(--gold-lt); border:0.5px solid rgba(201,168,76,0.2); }

/* ── Popup (PoI-level) ── */
.poi-popup { padding:14px 16px 12px; min-width:230px; max-width:260px; }
.poi-popup-cat {
  display:inline-flex; align-items:center; gap:5px;
  font-size:0.6rem; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--navy); background:var(--gold-lt); padding:2px 8px;
  border-radius:20px; margin-bottom:8px; font-weight:700;
}
.poi-popup-title { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:600; color:var(--gold); margin-bottom:4px; line-height:1.2; }
.poi-popup-honoree { font-size:0.7rem; color:var(--gold-lt); font-style:italic; margin-bottom:8px; }
.poi-popup-desc { font-size:0.76rem; color:var(--sand); line-height:1.5; margin-bottom:10px; }
.poi-popup-link {
  display:inline-block; font-size:0.68rem; font-weight:700; letter-spacing:0.04em;
  text-transform:uppercase; color:var(--navy); background:var(--gold);
  padding:5px 12px; border-radius:2px; text-decoration:none; margin-bottom:10px;
}
.poi-popup-link:hover { background:var(--gold-lt); }
/* .poi-popup-toggle is now a real <button> — reset native chrome */
.poi-popup-toggle {
  font-size:0.66rem; letter-spacing:0.04em; text-transform:uppercase;
  color:var(--gold-lt); cursor:pointer; margin-bottom:6px; user-select:none;
  border:none; background:none; font-family:inherit; padding:0; display:block;
}
.poi-popup-toggle:hover { color:var(--gold); }
.poi-popup-fulltext {
  font-size:0.72rem; color:var(--sand); line-height:1.55;
  max-height:200px; overflow-y:auto; margin-bottom:10px;
  padding:8px 10px; background:rgba(0,0,0,0.18);
  border:0.5px solid rgba(201,168,76,0.2); border-radius:2px;
}
.poi-popup-photo {
  width:100%; height:120px; object-fit:cover; object-position:top; border-radius:2px;
  border:1px solid rgba(201,168,76,0.4); margin-bottom:8px; display:block;
  cursor:zoom-in; transition:opacity 0.15s, border-color 0.15s;
}
.poi-popup-photo:hover { opacity:0.88; border-color:var(--gold); }
.poi-popup-gallery {
  display:flex; gap:5px; overflow-x:auto; margin-bottom:8px; padding-bottom:2px;
}
.poi-popup-thumb {
  width:54px; height:54px; flex-shrink:0; object-fit:cover; border-radius:2px;
  border:1px solid rgba(201,168,76,0.4); cursor:zoom-in;
  transition:opacity 0.15s, border-color 0.15s;
}
.poi-popup-thumb:hover { opacity:0.85; border-color:var(--gold); }
.poi-popup-nophoto {
  width:100%; height:60px; display:flex; align-items:center; justify-content:center;
  border:1px dashed rgba(201,168,76,0.25); border-radius:2px; color:var(--stone);
  font-size:0.62rem; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:8px;
}
.poi-popup-meta { font-size:0.62rem; color:var(--stone); border-top:0.5px solid rgba(201,168,76,0.2); padding-top:6px; }

/* ── Photo lightbox ── */
.mmm-lightbox {
  display:none; position:fixed; inset:0; z-index:5000;
  background:rgba(0,10,30,0.92); align-items:center; justify-content:center;
  cursor:zoom-out; padding:24px;
}
.mmm-lightbox.show { display:flex; }
.mmm-lightbox img {
  max-width:92vw; max-height:88vh; object-fit:contain;
  border:1.5px solid var(--gold); border-radius:3px;
  box-shadow:0 8px 40px rgba(0,0,0,0.7);
}
.mmm-lightbox-close {
  position:absolute; top:18px; right:24px; color:var(--gold-lt);
  font-size:1.8rem; font-family:'Lato',sans-serif; line-height:1;
  cursor:pointer; background:none; border:none;
}
.mmm-lightbox-nav {
  position:absolute; top:50%; transform:translateY(-50%);
  color:var(--gold-lt); font-size:2.4rem; font-family:'Lato',sans-serif;
  line-height:1; cursor:pointer; background:rgba(0,20,60,0.5);
  border:1px solid rgba(201,168,76,0.4); border-radius:50%;
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
}
.mmm-lightbox-nav:hover { background:rgba(0,20,60,0.85); border-color:var(--gold); }
.mmm-lightbox-nav.prev { left:18px; }
.mmm-lightbox-nav.next { right:18px; }
.mmm-lightbox-counter {
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  color:var(--sand); font-size:0.72rem; letter-spacing:0.05em;
  background:rgba(0,20,60,0.7); padding:3px 12px; border-radius:20px;
}
</style>
</head>
<body>

<div id="map"></div>

<div class="mmm-lightbox" id="mmmLightbox" onclick="closeLightbox()">
  <button class="mmm-lightbox-close" onclick="closeLightbox(event)" aria-label="Close photo">&times;</button>
  <button class="mmm-lightbox-nav prev" id="mmmLightboxPrev" onclick="navLightbox(event,-1)" aria-label="Previous photo">&#8249;</button>
  <img id="mmmLightboxImg" src="" alt="" onclick="event.stopPropagation()">
  <button class="mmm-lightbox-nav next" id="mmmLightboxNext" onclick="navLightbox(event,1)" aria-label="Next photo">&#8250;</button>
  <div class="mmm-lightbox-counter" id="mmmLightboxCounter" style="display:none;"></div>
</div>

<div class="campus-panel">
  <div class="campus-panel-title">Campus <span class="zoom-level" id="zoomLevel"></span></div>
  <button class="campus-btn" onclick="flyTo('blueridge')">Blue Ridge <span class="campus-count" id="count-blueridge"></span></button>
  <button class="campus-btn" onclick="flyTo('cumming')">Cumming <span class="campus-count" id="count-cumming"></span></button>
  <button class="campus-btn" onclick="flyTo('dahlonega')">Dahlonega <span class="campus-count" id="count-dahlonega"></span></button>
  <button class="campus-btn" onclick="flyTo('gainesville')">Gainesville <span class="campus-count" id="count-gainesville"></span></button>
  <button class="campus-btn" onclick="flyTo('oconee')">Oconee <span class="campus-count" id="count-oconee"></span></button>
  <button class="back-btn" id="backBtn" onclick="showOverview()">&#8249; All Campuses</button>
</div>

<div class="legend" id="legend"></div>

<script>
/* ======================================================================
   CAMPUS OVERVIEW DATA
====================================================================== */
const CAMPUSES = {
  dahlonega:   { name:'Dahlonega Campus',   lat:34.5297,  lng:-83.9849,  zoom:15, poiZoom:16, active:true, campusCode:2,
    tags:['Walkway of Service','Monuments','Historic Markers'],
    desc:'UNG\'s founding campus (1873) and home to the Corps of Cadets, in the foothills of the Blue Ridge Mountains. Home to Price Memorial Hall and the Walkway of Service.' },
  gainesville: { name:'Gainesville Campus', lat:34.236050, lng:-83.867558, zoom:14, poiZoom:16, active:true, campusCode:3,
    tags:['Walkway of Service','Monuments','Historic Markers'],
    desc:'UNG\'s Gainesville Campus combines the energy of a large campus with the closeness of a small one — home to the Memorial and Remembrance Gardens and the historic Wetland Pavilion.' },
  cumming:     { name:'Cumming Campus',     lat:34.22394, lng:-84.10806, zoom:16, poiZoom:18, active:true, campusCode:1,
    tags:['Commuter Campus', 'Fast-Growing Region'],
    desc:'UNG\'s Cumming Campus sits north of Alpharetta in one of Georgia\'s fastest-growing counties, offering small class sizes and easy access to Metro Atlanta. Monuments and markers here are still being documented.' },
  blueridge:   { name:'Blue Ridge Campus',  lat:34.88866, lng:-84.29174, zoom:16, poiZoom:18, active:true, campusCode:0,
    tags:['Ralston Hall','Memorials','New Campus'],
    desc:'A mountain-town campus in Blue Ridge, home to the new David E. Ralston Hall, named for the UNG alumnus who served as Georgia\u2019s longest-tenured House Speaker.' },
  oconee:      { name:'Oconee Campus',      lat:33.86621, lng:-83.42595, zoom:16, poiZoom:18, active:true, campusCode:4,
    tags:['Monuments','Markers'],
    desc:'UNG\u2019s Oconee Campus in Watkinsville, the Artland of Georgia, offers a small-campus environment just south of Athens, fostering close connections between students and faculty.' },
};
const CAMPUS_ORDER = ['blueridge','cumming','dahlonega','gainesville','oconee'];

/* ======================================================================
   MMM CATEGORY DOMAIN — mirrors the MMM_Category coded-value domain
   used on the MMM_Point / MMM_Polygon feature classes in the FGDB.
   Keep these codes identical to the GIS domain so field data drops
   straight in without a translation layer.
====================================================================== */
const CATEGORY_META = {
  MON:     { label:'Monument',            color:'#C9A84C' },
  MRK:     { label:'Marker',              color:'#A08558' },
  MEM:     { label:'Memorial',            color:'#8B3A3A' },
  MIL_EQ:  { label:'Military Equipment',  color:'#5B6770' },
  NM_BLDG: { label:'Named Building/Space',color:'#3D5A80' },
  OTH:     { label:'Other',               color:'#6b6156' },
};
const DEFAULT_CATEGORY = 'OTH'; // fallback bucket for features with a null/unrecognized Category

/* Status domain — mirrors the Status coded-value domain on MMM_Point */
const STATUS_META = {
  ACT: 'Active',
  REM: 'Removed',
  REL: 'Relocated',
  DMG: 'Damaged',
  UR:  'Under Restoration',
  PP:  'Proposed/Planned',
};

/* Mount domain — mirrors the shared MOUNTING_TYPE coded-value domain
   (also used on access points; only FS/WM/GS are expected on MMM) */
const MOUNT_META = {
  FS: 'Freestanding',
  WM: 'Wall-Mounted',
  GS: 'Ground-Set',
  SUR: 'Surface Mount - Ceiling',
  SUR_W: 'Surface Mount - Wall',
  SA: 'Stand Alone',
  RM: 'Rack Mount',
  PL: 'Placed on Surface',
};



/* ======================================================================
   DATA SOURCE — live ArcGIS Online hosted feature service
====================================================================== */
const MMM_SERVICE_URL = 'https://services3.arcgis.com/4ADpogqF2B4hadEB/arcgis/rest/services/Monuments_Markers_Memorials_Points/FeatureServer';

let mmmLayerIdPromise = null;
function resolveMmmLayerId() {
  if (!mmmLayerIdPromise) {
    mmmLayerIdPromise = fetch(`${MMM_SERVICE_URL}?f=json`)
      .then(res => res.json())
      .then(data => (data.layers && data.layers.length ? data.layers[0].id : 0))
      .catch(() => 0);
  }
  return mmmLayerIdPromise;
}

function esc(str) {
  return String(str || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function esriFeatureToMapFeature(f) {
  const p = f.properties;
  return {
    type:'Feature',
    geometry:f.geometry,
    properties:{
      OBJECTID: p.OBJECTID,
      Title: p.Name || 'Untitled',
      Category: p.Category || DEFAULT_CATEGORY,
      Honoree: p.Honoree || '',
      Description: p.Notes || '',
      Text: p.Text || '',
      Status: p.Status || '',
      Mount: p.Mount || '',
      WebURL: p.WebURL || '',
      DateAdded: p.CaptureDate ? new Date(p.CaptureDate).toLocaleDateString() : '',
    },
  };
}

async function fetchServicePOIs(campusCode) {
  const layerId = await resolveMmmLayerId();
  const url = `${MMM_SERVICE_URL}/${layerId}/query?where=Campus=${campusCode}&outFields=*&f=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Service query failed: ${res.status}`);
  const geojson = await res.json();
  if (geojson.error) throw new Error(geojson.error.message || 'Service returned an error');
  return {
    type:'FeatureCollection',
    features: (geojson.features || []).map(esriFeatureToMapFeature),
  };
}

async function loadCampusCounts() {
  try {
    const layerId = await resolveMmmLayerId();
    const statsUrl = `${MMM_SERVICE_URL}/${layerId}/query?where=1=1&groupByFieldsForStatistics=Campus&outStatistics=` +
      encodeURIComponent(JSON.stringify([{ statisticType:'count', onStatisticField:'Campus', outStatisticFieldName:'cnt' }])) +
      `&f=json`;
    const res = await fetch(statsUrl);
    const data = await res.json();

    const countsByCode = {};
    (data.features || []).forEach(f => {
      countsByCode[f.attributes.Campus] = f.attributes.cnt;
    });

    CAMPUS_ORDER.forEach((key) => {
      const el = document.getElementById(`count-${key}`);
      if (!el) return;
      const count = countsByCode[CAMPUSES[key].campusCode];
      el.textContent = count ? count : '\u2014';
    });
  } catch (e) {
    console.warn('Campus counts unavailable:', e.message);
  }
}

function wireAttachmentPhoto(marker, objectId, title) {
  marker.on('popupopen', async () => {
    const el = document.getElementById(`poi-photo-${objectId}`);
    if (!el || el.dataset.loaded) return;
    el.dataset.loaded = '1';
    try {
      const layerId = await resolveMmmLayerId();
      const res = await fetch(`${MMM_SERVICE_URL}/${layerId}/${objectId}/attachments?f=json`);
      const data = await res.json();
      const images = (data.attachmentInfos || []).filter(a => (a.contentType || '').startsWith('image/'));
      if (!images.length) return;

      const urls = images.map(a => `${MMM_SERVICE_URL}/${layerId}/${objectId}/attachments/${a.id}`);
      mmmGalleries[objectId] = urls;
      mmmGalleryTitles[objectId] = title || 'Untitled';

      if (urls.length === 1) {
        el.outerHTML = `<img id="poi-photo-${objectId}" class="poi-popup-photo" src="${urls[0]}" alt="${esc(title)} photograph" onclick="openLightbox(${objectId},0)">`;
      } else {
        const thumbs = urls.map((u, i) =>
          `<img class="poi-popup-thumb" src="${u}" alt="${esc(title)} photograph ${i + 1} of ${urls.length}" onclick="openLightbox(${objectId},${i})">`).join('');
        el.outerHTML = `<div class="poi-popup-gallery" id="poi-photo-${objectId}">${thumbs}</div>`;
      }
    } catch (e) { /* leave the no-photo placeholder in place */ }
  });
}

const mmmGalleries = {};
const mmmGalleryTitles = {};
let lightboxState = { objectId:null, index:0 };

function renderLightbox() {
  const urls = mmmGalleries[lightboxState.objectId] || [];
  const title = mmmGalleryTitles[lightboxState.objectId] || '';
  const img = document.getElementById('mmmLightboxImg');
  img.src = urls[lightboxState.index] || '';
  img.alt = title ? `${title} photograph` : '';
  const multi = urls.length > 1;
  document.getElementById('mmmLightboxPrev').style.display = multi ? 'flex' : 'none';
  document.getElementById('mmmLightboxNext').style.display = multi ? 'flex' : 'none';
  const counter = document.getElementById('mmmLightboxCounter');
  counter.style.display = multi ? 'block' : 'none';
  if (multi) counter.textContent = `${lightboxState.index + 1} / ${urls.length}`;
}

function openLightbox(objectId, index) {
  lightboxState = { objectId, index: index || 0 };
  renderLightbox();
  document.getElementById('mmmLightbox').classList.add('show');
}
function closeLightbox(e) {
  if (e) e.stopPropagation();
  document.getElementById('mmmLightbox').classList.remove('show');
}
function navLightbox(e, delta) {
  e.stopPropagation();
  const urls = mmmGalleries[lightboxState.objectId] || [];
  if (!urls.length) return;
  lightboxState.index = (lightboxState.index + delta + urls.length) % urls.length;
  renderLightbox();
}
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('mmmLightbox').classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(new Event('key'), -1);
  if (e.key === 'ArrowRight') navLightbox(new Event('key'), 1);
});

/* ======================================================================
   MAP SETUP
====================================================================== */
const map = L.map('map', {
  center:[34.3408,-83.9439], zoom:8.5, minZoom:7, maxZoom:19,
  zoomSnap:0.25, zoomDelta:0.25, // allows fractional zoom levels, e.g. 8.5
  attributionControl:true, scrollWheelZoom:false,
});
map.once('focus', () => map.scrollWheelZoom.enable());

/* ── Oconee-only overzoom ────────────────────────────────────────────
   Oconee has several MMM points close enough together that 19 isn't
   enough to visually separate them. Rather than raising maxZoom for
   every campus, the ceiling is raised only while Oconee is the active
   campus (set/cleared in flyTo / showOverview below) — everywhere
   else keeps the normal 19 cap. maxNativeZoom stays at the tile
   source's real resolution, so anything past it is Leaflet upscaling
   the last real tile rather than fetching sharper imagery. */
const DEFAULT_MAX_ZOOM = 19;
const OCONEE_MAX_ZOOM = 22;
function setOconeeOverzoom(enabled) {
  const z = enabled ? OCONEE_MAX_ZOOM : DEFAULT_MAX_ZOOM;
  map.setMaxZoom(z);
  baseTileLayer.options.maxZoom = z; // maxNativeZoom governs actual tile fetches
}

const MARKER_HIDE_ZOOM = 15;
function updateCampusMarkerVisibility() {
  const hide = map.getZoom() >= MARKER_HIDE_ZOOM;
  CAMPUS_ORDER.forEach((key) => {
    if (!CAMPUSES[key].active) return;
    const m = campusMarkers[key];
    if (!m) return;
    if (hide && map.hasLayer(m)) map.removeLayer(m);
    else if (!hide && !map.hasLayer(m)) m.addTo(map);
  });
}
map.on('zoomend', updateCampusMarkerVisibility);

function updateZoomLevelDisplay() {
  document.getElementById('zoomLevel').textContent = `Z${Math.round(map.getZoom() * 10) / 10}`;
}
map.on('zoom', updateZoomLevelDisplay);
updateZoomLevelDisplay();

const baseTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  maxNativeZoom:19, // OSM tiles stop being fetched here regardless of map.maxZoom
  attribution:'Leaflet | &copy; OpenStreetMap contributors | John Segars, UNG Facilities GIS',
  className:'osm-tiles',
}).addTo(map);

/* ---- Campus-level markers ---- */
const campusMarkers = {};

CAMPUS_ORDER.forEach((key) => {
  const c = CAMPUSES[key];
  const cls = c.active ? 'active' : 'inactive';
  const shortName = c.name.replace(' Campus','');

  const icon = L.divIcon({
    html:`<div class="campus-marker">
      <div style="position:relative;width:28px;height:28px;">
        <div class="marker-pulse ${cls}"></div>
        <div class="marker-dot ${cls}"></div>
      </div>
      <div class="marker-label ${cls}">${shortName}</div>
    </div>`,
    className:'', iconSize:[100,44], iconAnchor:[50,10], popupAnchor:[0,-14],
  });

  const marker = L.marker([c.lat, c.lng], { icon }).addTo(map);

  const tagsHtml = c.tags.map(t => `<span class="popup-tag">${t}</span>`).join('');
  const btnHtml = c.active
    ? `<button class="popup-btn" onclick="flyTo('${key}')">Zoom to Markers &amp; Memorials</button>`
    : `<span class="popup-btn-disabled">Coming Soon</span>`;

  marker.bindPopup(L.popup({ maxWidth:280 }).setContent(`
    <div class="popup-inner">
      <div class="popup-campus">University of North Georgia</div>
      <div class="popup-title">${c.name}</div>
      <div class="popup-tags">${tagsHtml}</div>
      <div class="popup-desc">${c.desc}</div>
      ${btnHtml}
    </div>`));

  campusMarkers[key] = marker;
});

/* ---- PoI (MMM) layer state ---- */
let activeCluster = null;
let activeCampusKey = null;
let campusFeatureCache = {};
let activeFilters = new Set();

function categoryBadgeIcon(code) {
  const meta = CATEGORY_META[code] || CATEGORY_META[DEFAULT_CATEGORY];
  const label = (code || DEFAULT_CATEGORY).replace('_','');
  return L.divIcon({
    html:`<div class="poi-badge" style="background:${meta.color};">${label}</div>`,
    className:'', iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-10],
  });
}

function poiPopupHtml(props) {
  const meta = CATEGORY_META[props.Category] || CATEGORY_META[DEFAULT_CATEGORY];
  const statusLabel = STATUS_META[props.Status] || props.Status || '';
  const mountLabel = MOUNT_META[props.Mount] || props.Mount || '';
  const honoreeHtml = props.Honoree
    ? `<div class="poi-popup-honoree">Named for ${esc(props.Honoree)}</div>` : '';
  const photoHtml = `<div class="poi-popup-nophoto" id="poi-photo-${props.OBJECTID}">No photo on file</div>`;
  const metaParts = [statusLabel || 'Active', mountLabel, props.DateAdded ? 'added ' + props.DateAdded : '']
    .filter(Boolean).join(' &middot; ');
  const linkHtml = props.WebURL
    ? `<a class="poi-popup-link" href="${esc(props.WebURL)}" target="_blank" rel="noopener">Learn More &#8599;</a>` : '';
  const fullTextHtml = props.Text
    ? `<button class="poi-popup-toggle" onclick="toggleFullText(this,'ft-${props.OBJECTID}')" aria-expanded="false">Read full marker text &#9662;</button>
       <div class="poi-popup-fulltext" id="ft-${props.OBJECTID}" style="display:none;">${esc(props.Text).replace(/\n/g,'<br>')}</div>` : '';
  return `
    <div class="poi-popup">
      <span class="poi-popup-cat">${meta.label}</span>
      <div class="poi-popup-title">${esc(props.Title) || 'Untitled'}</div>
      ${honoreeHtml}
      ${photoHtml}
      <div class="poi-popup-desc">${esc(props.Description)}</div>
      ${fullTextHtml}
      ${linkHtml}
      <div class="poi-popup-meta">${metaParts}</div>
    </div>`;
}

function toggleFullText(el, targetId) {
  const box = document.getElementById(targetId);
  const showing = box.style.display !== 'none';
  box.style.display = showing ? 'none' : 'block';
  el.innerHTML = showing ? 'Read full marker text &#9662;' : 'Hide full marker text &#9652;';
  el.setAttribute('aria-expanded', showing ? 'false' : 'true');
}

function buildClusterGroup(features, campusKey) {
  const isOconee = campusKey === 'oconee';
  const group = L.markerClusterGroup({
    maxClusterRadius: isOconee ? 25 : 45,
    // Oconee's tight cluster of points breaks apart (spiderfies) once the
    // user reaches zoom 19, rather than waiting for the full overzoom
    // ceiling — spiderfyOnMaxZoom is on by default, this just lowers the
    // zoom at which "max" kicks in, scoped to this one cluster group only.
    disableClusteringAtZoom: isOconee ? 19 : null,
    iconCreateFunction: (cluster) => L.divIcon({
      html:`<div class="mmm-cluster" style="width:36px;height:36px;font-size:0.75rem;">${cluster.getChildCount()}</div>`,
      className:'', iconSize:[36,36],
    }),
  });
  features
    .filter(f => activeFilters.has(f.properties.Category))
    .forEach(f => {
      const [lng, lat] = f.geometry.coordinates;
      const marker = L.marker([lat, lng], { icon: categoryBadgeIcon(f.properties.Category) });
      marker.bindPopup(poiPopupHtml(f.properties), { maxWidth:280 });
      wireAttachmentPhoto(marker, f.properties.OBJECTID, f.properties.Title);
      group.addLayer(marker);
    });
  return group;
}

function renderLegendCampus(campusName, features) {
  const present = [...new Set(features.map(f => f.properties.Category || DEFAULT_CATEGORY))];
  const rows = present.map(code => {
    const meta = CATEGORY_META[code] || CATEGORY_META[DEFAULT_CATEGORY];
    const count = features.filter(f => (f.properties.Category || DEFAULT_CATEGORY) === code).length;
    const isOn = activeFilters.has(code);
    return `
      <button class="legend-row filterable ${isOn ? '' : 'off'}" onclick="toggleCategory('${code}')" aria-pressed="${isOn}">
        <div class="legend-badge" style="background:${meta.color};">${code.replace('_','')}</div>
        <span>${meta.label}</span>
        <span class="legend-count">${count}</span>
      </button>`;
  }).join('');
  document.getElementById('legend').innerHTML = `
    <div class="legend-title">${campusName}</div>
    <div class="legend-sub">Tap a category to show/hide</div>
    ${rows}`;
}

function toggleCategory(code) {
  if (activeFilters.has(code)) activeFilters.delete(code); else activeFilters.add(code);
  const features = campusFeatureCache[activeCampusKey] || [];
  if (activeCluster) map.removeLayer(activeCluster);
  activeCluster = buildClusterGroup(features, activeCampusKey);
  activeCluster.addTo(map);
  renderLegendCampus(CAMPUSES[activeCampusKey].name, features);
}

async function loadCampusPOIs(key) {
  const c = CAMPUSES[key];
  let geojson;
  try {
    geojson = await fetchServicePOIs(c.campusCode);
    if (!geojson.features.length) throw new Error('no features returned for this campus yet');
  } catch (e) {
    console.warn(`MMM service unavailable for ${key}, using sample data:`, e.message);
    geojson = SAMPLE_POI_DATA[key];
  }
  if (!geojson || !geojson.features || !geojson.features.length) return;

  const features = geojson.features;
  campusFeatureCache[key] = features;
  activeFilters = new Set(features.map(f => f.properties.Category));

  if (activeCluster) map.removeLayer(activeCluster);
  activeCluster = buildClusterGroup(features, key);
  activeCluster.addTo(map);

  renderLegendCampus(CAMPUSES[key].name, features);
}

/* ---- Mode switching ---- */
function flyTo(key) {
  const c = CAMPUSES[key];
  if (!c) return;

  document.querySelectorAll('.campus-btn').forEach(b => b.classList.remove('active'));
  const idx = CAMPUS_ORDER.indexOf(key);
  if (idx >= 0) document.querySelectorAll('.campus-btn')[idx].classList.add('active');

  setOconeeOverzoom(key === 'oconee');

  const targetZoom = c.active ? c.poiZoom : c.zoom;
  map.flyTo([c.lat, c.lng], targetZoom, { animate:true, duration:1.2 });

  if (c.active) {
    activeCampusKey = key;
    document.getElementById('backBtn').classList.add('show');
    campusMarkers[key].closePopup();
    setTimeout(() => loadCampusPOIs(key), 600);
  } else {
    setTimeout(() => campusMarkers[key].openPopup(), 1300);
  }
}

function showOverview() {
  setOconeeOverzoom(false);
  if (activeCluster) { map.removeLayer(activeCluster); activeCluster = null; }
  activeCampusKey = null;
  document.getElementById('backBtn').classList.remove('show');
  document.querySelectorAll('.campus-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('legend').innerHTML = '';
  map.flyTo([34.3408,-83.9439], 8.5, { animate:true, duration:1.0 });
}

loadCampusCounts();
</script>
